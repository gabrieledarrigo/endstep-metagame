  <rect class="tile" width="64" height="64" rx="10"/>
  <rect class="bar-1" x="14" y="14.5" width="36" height="9" rx="2"/>
  <rect class="bar-2" x="14" y="27.5" width="26" height="9" rx="2"/>
  <rect class="bar-3" x="14" y="40.5" width="16" height="9" rx="2"/>
