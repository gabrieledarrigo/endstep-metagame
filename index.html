<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pauper Metagame</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f9f9f7;
        --surface: #fcfcfb;
        --edge: rgba(11, 11, 11, 0.1);

        --text-900: #0b0b0b;
        --text-600: #52514e;
        --text-400: #898781;
        --text-inverse: #ffffff;

        --rule: #e1e0d9;
        --baseline: #c3c2b7;

        --primary: #1c5cab;
        --primary-wash: #eaf1fb;
        --secondary: #3f3f3c;

        --up: #006300;
        --down: #d03b3b;

        --s1: #2a78d6;
        --s2: #eb6834;
        --s3: #1baf7a;
        --s4: #eda100;
        --s5: #e87ba4;
        --s6: #008300;
        --s7: #4a3aa7;
        --s8: #e34948;

        --seq-100: #cde2fb;
        --seq-200: #9ec5f4;
        --seq-300: #6da7ec;
        --seq-400: #3987e5;
        --seq-500: #256abf;
        --seq-600: #184f95;
        --seq-700: #0d366b;

        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text-900);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 1080px;
        margin: 0 auto;
        padding-inline: 20px;
        padding-block: 40px 72px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .page__eyebrow {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-400);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 22px;
      }

      .stat-list {
        display: flex;
        flex-wrap: wrap;
        gap: 34px;
        align-items: flex-end;
        margin: 0;
      }

      .stat-tile {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-tile__label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-400);
      }

      .stat-tile__value {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .stat-tile--hero .stat-tile__value {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .state-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 42px 22px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 10px;
      }

      .state-panel__title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .state-panel__detail {
        margin: 0;
        font-size: 14px;
        color: var(--text-600);
        max-width: 44ch;
      }

      .button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 9px 17px;
        border-radius: 7px;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .button--primary {
        background: var(--primary);
        color: var(--text-inverse);
      }

      .button--primary:hover {
        background: #184f95;
      }

      .button--secondary {
        background: var(--surface);
        color: var(--secondary);
        border-color: var(--edge);
      }

      .button--secondary:hover {
        background: #f1f0ec;
      }

      .button--ghost {
        background: transparent;
        color: var(--primary);
      }

      .button--ghost:hover {
        background: var(--primary-wash);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .button--primary:disabled:hover {
        background: var(--primary);
      }

      .button--secondary:disabled:hover {
        background: var(--surface);
      }

      .button--ghost:disabled:hover {
        background: transparent;
      }

      .segmented {
        display: inline-flex;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
        max-width: 100%;
      }

      @media (max-width: 400px) {
        .segmented {
          overflow-x: auto;
        }
      }

      .segmented__option {
        flex: 0 0 auto;
        font-family: inherit;
        cursor: pointer;
        border: 0;
        background: transparent;
        color: var(--text-600);
        font-size: 13px;
        font-weight: 600;
        padding: 7px 15px;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }

      .segmented__option:hover {
        background: #f1f0ec;
        color: var(--text-900);
      }

      .segmented__option[aria-pressed='true'] {
        background: var(--primary);
        color: var(--text-inverse);
      }

      .segmented__option[aria-pressed='true']:hover {
        background: #184f95;
      }

      .segmented__option:disabled:hover {
        background: transparent;
        color: var(--text-600);
      }

      .segmented__option[aria-pressed='true']:disabled:hover {
        background: var(--primary);
        color: var(--text-inverse);
      }

      .colour-pips {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        flex-shrink: 0;
      }

      .colour-pips__pip {
        width: 17px;
        height: 17px;
        display: block;
      }

      .colour-pips__pip text {
        font: 700 11px var(--sans);
        fill: #1a1714;
      }

      .chart-frame {
        width: 100%;
      }

      .chart-tooltip {
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 11px 13px;
        box-shadow: 0 4px 14px rgba(11, 11, 11, 0.09);
        display: inline-flex;
        flex-direction: column;
        gap: 7px;
        min-width: 196px;
      }

      .chart-tooltip__day {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-400);
      }

      .chart-tooltip__row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      .chart-tooltip__swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .chart-tooltip__name {
        color: var(--text-600);
        flex: 1;
      }

      .chart-tooltip__value {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
      }

      .chart-legend__item {
        all: unset;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: var(--text-600);
      }

      .chart-legend__item:hover {
        color: var(--text-900);
      }

      .chart-legend__item--off {
        opacity: 0.4;
        text-decoration: line-through;
      }

      .chart-legend__swatch {
        width: 12px;
        height: 3px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .skeleton {
        background: var(--rule);
        border-radius: 5px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
        }
      }

      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .scaffold {
        border: 1px dashed var(--baseline);
        border-radius: 10px;
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .scaffold__title {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-400);
      }

      .scaffold__list {
        margin: 0;
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 4px 16px;
        font-size: 13px;
      }

      .scaffold__list dt {
        color: var(--text-600);
      }

      .scaffold__list dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      .gallery {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .gallery__label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-400);
        margin-top: 10px;
      }

      .gallery__row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }

      .gallery__states {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
        margin-top: 14px;
      }

      footer {
        font-size: 13px;
        color: var(--text-600);
      }

      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js"
      integrity="sha384-XYVQ7LtYqgha4ByzNRLR6NHo9p0yVDvmTNuQkiIweU0U8WqLWBkH1L771VlP6fYx"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/recharts@3.10.1/umd/Recharts.js"
      integrity="sha384-B2qLloNSIrxapii5UnBrm+3aDNWhVlmIFQONXg13tES0lEd7YUzh6lrjD3WSiwZ1"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.9/babel.min.js"
      integrity="sha384-oLbIC13I/8DNBviftYPfOFQS5DC2WUmwk0SyIPmnzu1Ui+vYyATSSBJiJ5ETa4o/"
    ></script>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useCallback } = React
      const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip } = Recharts

      const FORMAT = 'Pauper'
      const POPULATION = 'rated'
      const WINDOWS = ['1d', '7d', '14d', '30d', 'season']
      const DEFAULT_WINDOW = '30d'
      const PAGE_SIZE = 24
      const MAX_RETRIES = 2
      const RETRY_BASE_MS = 400

      function readTimeWindow() {
        const value = new URLSearchParams(location.search).get('window')
        return WINDOWS.includes(value) ? value : DEFAULT_WINDOW
      }

      function failure(status) {
        if (status === 429) {
          return {
            kind: 'rateLimit',
            message: 'Too many requests reached Endstep. The data is cached for five minutes, so this usually clears on its own.',
          }
        }
        if (status === 502 || status === 504) {
          return { kind: 'upstream', message: 'Endstep did not respond.' }
        }
        return { kind: 'http', message: `The request failed with status ${status}.` }
      }

      function wait(ms, signal) {
        return new Promise((resolve, reject) => {
          if (signal.aborted) {
            reject(new DOMException('Aborted', 'AbortError'))
            return
          }

          const onAbort = () => {
            clearTimeout(timer)
            reject(new DOMException('Aborted', 'AbortError'))
          }

          const timer = setTimeout(() => {
            signal.removeEventListener('abort', onAbort)
            resolve()
          }, ms)

          signal.addEventListener('abort', onAbort, { once: true })
        })
      }

      async function getJson(path, params, signal) {
        const url = `/api/metagame/${path}?${new URLSearchParams(params)}`

        for (let attempt = 0; ; attempt += 1) {
          let response

          try {
            response = await fetch(url, { signal })
          } catch (error) {
            if (error.name === 'AbortError') throw error
            if (attempt === MAX_RETRIES) {
              throw Object.assign(new Error('The server could not be reached.'), { kind: 'network' })
            }
            await wait(RETRY_BASE_MS * 2 ** attempt, signal)
            continue
          }

          if (response.ok) {
            try {
              return await response.json()
            } catch (error) {
              if (error.name === 'AbortError') throw error
              throw Object.assign(new Error('The server returned a malformed response.'), {
                kind: 'malformed',
              })
            }
          }

          const detail = failure(response.status)
          const retryable = response.status === 429 || response.status >= 500

          if (!retryable || attempt === MAX_RETRIES) {
            throw Object.assign(new Error(detail.message), detail, { status: response.status })
          }

          await wait(RETRY_BASE_MS * 2 ** attempt, signal)
        }
      }

      function useTimeWindow() {
        const [value, setValue] = useState(readTimeWindow)

        useEffect(() => {
          const sync = () => setValue(readTimeWindow())
          window.addEventListener('popstate', sync)
          return () => window.removeEventListener('popstate', sync)
        }, [])

        return value
      }

      function useMetagame(timeWindow) {
        const [state, setState] = useState({ status: 'loading' })
        const [reloads, setReloads] = useState(0)

        useEffect(() => {
          const controller = new AbortController()
          setState({ status: 'loading' })

          Promise.all([
            getJson(
              `${FORMAT}/decks`,
              {
                window: timeWindow,
                population: POPULATION,
                sort: 'share',
                dir: 'desc',
                page: 1,
                pageSize: PAGE_SIZE,
              },
              controller.signal
            ),
            getJson(
              `${FORMAT}/share-series`,
              { window: timeWindow, population: POPULATION },
              controller.signal
            ),
          ])
            .then(([decks, series]) => setState({ status: 'ready', decks, series }))
            .catch((error) => {
              if (error.name === 'AbortError') return
              setState({ status: 'error', error })
            })

          return () => controller.abort()
        }, [timeWindow, reloads])

        const reload = useCallback(() => setReloads((count) => count + 1), [])

        return [state, reload]
      }

      const PIP_FILL = {
        W: '#fffbd5',
        U: '#aae0fa',
        B: '#cbc2bf',
        R: '#f9aa8f',
        G: '#9bd3ae',
        C: '#cac5c0',
      }

      const PIP_NAME = {
        W: 'white',
        U: 'blue',
        B: 'black',
        R: 'red',
        G: 'green',
        C: 'colourless',
      }

      function Panel({ children }) {
        return <div className="panel">{children}</div>
      }

      function Button({ variant = 'primary', className, children, ...rest }) {
        return (
          <button type="button" {...rest} className={['button', 'button--' + variant, className].filter(Boolean).join(' ')}>
            {children}
          </button>
        )
      }

      function ColourPips({ colours }) {
        const known = (colours || []).filter((letter) => letter in PIP_FILL)
        const letters = known.length > 0 ? known : ['C']

        return (
          <span className="colour-pips">
            <span className="visually-hidden">
              Colours: {letters.map((letter) => PIP_NAME[letter]).join(', ')}
            </span>
            {letters.map((letter, index) => (
              <svg key={index} className="colour-pips__pip" viewBox="0 0 20 20" aria-hidden="true">
                <circle
                  cx="10"
                  cy="10"
                  r="9"
                  fill={PIP_FILL[letter]}
                  stroke="rgba(11,11,11,.22)"
                  strokeWidth="1"
                />
                <text x="10" y="14.3" textAnchor="middle">
                  {letter}
                </text>
              </svg>
            ))}
          </span>
        )
      }

      function SegmentedControl({ label, options, value, onChange, disabled }) {
        return (
          <div className="segmented" role="group" aria-label={label}>
            {options.map((option) => (
              <button
                key={option}
                type="button"
                className="segmented__option"
                aria-pressed={option === value}
                disabled={disabled}
                onClick={() => onChange(option)}
              >
                {option}
              </button>
            ))}
          </div>
        )
      }

      function StatTile({ label, value, hero }) {
        return (
          <div className={hero ? 'stat-tile stat-tile--hero' : 'stat-tile'}>
            <dt className="stat-tile__label">{label}</dt>
            <dd className="stat-tile__value">{value}</dd>
          </div>
        )
      }

      function Skeleton({ width, height }) {
        return <div className="skeleton" style={{ width, height }} aria-hidden="true" />
      }

      function StatePanel({ title, detail, action, busy }) {
        return (
          <div className="state-panel" aria-busy={busy || undefined}>
            <h2 className="state-panel__title">{title}</h2>
            {detail && <p className="state-panel__detail">{detail}</p>}
            {action}
          </div>
        )
      }

      const rootTokens = getComputedStyle(document.documentElement)
      const token = (name) => rootTokens.getPropertyValue(name).trim()

      const SERIES_COLOURS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'].map(token)
      const CHART_GRID = token('--rule')
      const CHART_BASELINE = token('--baseline')
      const CHART_TICK = token('--text-400')
      const CHART_SURFACE = token('--surface')

      const CHART_AXIS = {
        tickLine: false,
        tick: { fill: CHART_TICK, fontSize: 12 },
        axisLine: { stroke: CHART_BASELINE },
      }

      const CHART_CARTESIAN_GRID = { stroke: CHART_GRID, vertical: false }

      const seriesSlots = new Map()

      function seriesColours(keys) {
        const taken = new Set()
        const unplaced = []

        keys.forEach((key) => {
          const slot = seriesSlots.get(key)
          if (slot === undefined || taken.has(slot)) unplaced.push(key)
          else taken.add(slot)
        })

        let free = 0
        unplaced.forEach((key) => {
          while (taken.has(free)) free += 1
          taken.add(free)
          seriesSlots.set(key, free)
        })

        return new Map(keys.map((key) => [key, SERIES_COLOURS[seriesSlots.get(key)]]))
      }

      function ChartFrame({ aspect = 2.9, children }) {
        return (
          <div className="chart-frame" style={{ aspectRatio: String(aspect) }}>
            <ResponsiveContainer width="100%" height="100%">
              {children}
            </ResponsiveContainer>
          </div>
        )
      }

      function ChartTooltip({ active, payload, label, formatLabel = String, formatValue = String }) {
        if (!active || !payload) return null

        const rows = payload.filter((row) => row.value !== null && row.value !== undefined)
        if (rows.length === 0) return null

        rows.sort((a, b) => b.value - a.value)

        return (
          <div className="chart-tooltip">
            <div className="chart-tooltip__day">{formatLabel(label)}</div>
            {rows.map((row) => (
              <div className="chart-tooltip__row" key={row.dataKey}>
                <span className="chart-tooltip__swatch" style={{ background: row.color }} />
                <span className="chart-tooltip__name">{row.name}</span>
                <span className="chart-tooltip__value">{formatValue(row.value)}</span>
              </div>
            ))}
          </div>
        )
      }

      function ChartLegend({ items, hidden, onToggle }) {
        return (
          <div className="chart-legend">
            {items.map((item) => {
              const off = hidden.has(item.key)

              return (
                <button
                  key={item.key}
                  type="button"
                  className={off ? 'chart-legend__item chart-legend__item--off' : 'chart-legend__item'}
                  aria-pressed={!off}
                  onClick={() => onToggle(item.key)}
                >
                  <span className="chart-legend__swatch" style={{ background: item.colour }} />
                  {item.name}
                </button>
              )
            })}
          </div>
        )
      }

      function Scaffold({ decks, series }) {
        const range = decks.provenance.window
        const items = decks.decks.items
        const points = series.series.length > 0 ? series.series[0].points : []
        const withData = points.filter((point) => point.rate !== null).length
        const top = items[0]

        return (
          <div className="scaffold">
            <h2 className="scaffold__title">Temporary scaffold, removed by S1</h2>
            <dl className="scaffold__list">
              <dt>Window</dt>
              <dd>
                {range.preset}, {range.from} to {range.to}
              </dd>
              <dt>Population</dt>
              <dd>{decks.provenance.population}</dd>
              <dt>Decks returned</dt>
              <dd>
                {items.length} of {decks.decks.total}
              </dd>
              <dt>Series returned</dt>
              <dd>{series.series.length}</dd>
              <dt>Days with data</dt>
              <dd>
                {withData} of {points.length}
              </dd>
              <dt>Top deck</dt>
              <dd>{top ? `${top.name}, ${(top.share.rate * 100).toFixed(2)}%` : 'no decks'}</dd>
            </dl>
          </div>
        )
      }

      function shareRows(series) {
        const byDay = new Map()

        series.forEach((item) => {
          item.points.forEach((point) => {
            const row = byDay.get(point.day) || { day: point.day }
            row[item.deck.id] = point.rate === null ? null : point.rate * 100
            byDay.set(point.day, row)
          })
        })

        return [...byDay.values()].sort((a, b) => a.day.localeCompare(b.day))
      }

      const shortDay = (day) => day.slice(5)
      const axisShare = (share) => `${share}%`
      const tooltipShare = (share) => `${share.toFixed(2)}%`
      const longDay = (day) =>
        new Date(`${day}T00:00:00Z`).toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          timeZone: 'UTC',
        })

      function ChartScaffold({ series }) {
        const [hidden, setHidden] = useState(() => new Set())

        const colours = seriesColours(series.map((item) => item.deck.id))
        const rows = shareRows(series)

        const toggle = (key) =>
          setHidden((current) => {
            const next = new Set(current)
            if (next.has(key)) next.delete(key)
            else next.add(key)
            return next
          })

        return (
          <div className="scaffold">
            <h2 className="scaffold__title">Temporary chart, removed by S4</h2>

            <ChartFrame>
              <LineChart data={rows} margin={{ top: 8, right: 16, bottom: 0, left: 0 }} accessibilityLayer>
                <CartesianGrid {...CHART_CARTESIAN_GRID} />
                <XAxis dataKey="day" tickFormatter={shortDay} minTickGap={24} {...CHART_AXIS} />
                <YAxis tickFormatter={axisShare} width={46} {...CHART_AXIS} />
                <Tooltip
                  cursor={{ stroke: CHART_BASELINE }}
                  content={<ChartTooltip formatLabel={longDay} formatValue={tooltipShare} />}
                />
                {series
                  .filter((item) => !hidden.has(item.deck.id))
                  .map((item) => (
                    <Line
                      key={item.deck.id}
                      type="linear"
                      dataKey={item.deck.id}
                      name={item.deck.name}
                      stroke={colours.get(item.deck.id)}
                      strokeWidth={2}
                      dot={false}
                      activeDot={{ r: 3.5, strokeWidth: 2, stroke: CHART_SURFACE }}
                      isAnimationActive={false}
                    />
                  ))}
              </LineChart>
            </ChartFrame>

            <ChartLegend
              items={series.map((item) => ({
                key: item.deck.id,
                name: item.deck.name,
                colour: colours.get(item.deck.id),
              }))}
              hidden={hidden}
              onToggle={toggle}
            />
          </div>
        )
      }

      function Summary({ totals }) {
        return (
          <dl className="stat-list">
            <StatTile hero label="Registrations" value={totals.registrations.toLocaleString('en-GB')} />
            <StatTile label="Players" value={totals.players.toLocaleString('en-GB')} />
          </dl>
        )
      }

      function Gallery() {
        const [selected, setSelected] = useState('30d')

        return (
          <div className="scaffold">
            <h2 className="scaffold__title">Temporary gallery, removed once the real sections land</h2>

            <div className="gallery">
              <span className="gallery__label">Buttons</span>
              <div className="gallery__row">
                <Button>Retry</Button>
                <Button variant="secondary">View on endstep.cc</Button>
                <Button variant="ghost">Show all 24</Button>
                <Button disabled>Retry</Button>
                <Button variant="secondary" disabled>
                  Disabled
                </Button>
              </div>

              <span className="gallery__label">Segmented control</span>
              <div className="gallery__row">
                <SegmentedControl
                  label="Time window"
                  options={WINDOWS}
                  value={selected}
                  onChange={setSelected}
                />
              </div>

              <span className="gallery__label">Colour identity</span>
              <div className="gallery__row">
                <ColourPips colours={['W']} />
                <ColourPips colours={['R', 'G']} />
                <ColourPips colours={['W', 'U', 'B']} />
                <ColourPips colours={['W', 'U', 'B', 'R', 'G']} />
                <ColourPips colours={[]} />
              </div>

              <span className="gallery__label">Stat tiles</span>
              <dl className="stat-list">
                <StatTile hero label="Registrations" value="152,638" />
                <StatTile label="Players" value="6,729" />
                <StatTile label="Archetypes" value="265" />
              </dl>

              <span className="gallery__label">Skeletons</span>
              <div className="gallery__row" aria-busy="true">
                <Skeleton width="180px" height="17px" />
                <Skeleton width="90px" height="26px" />
                <Skeleton width="240px" height="12px" />
              </div>

              <span className="gallery__label">State panels</span>
            </div>

            <div className="gallery__states">
              <StatePanel
                title="The metagame could not be loaded"
                detail="Endstep did not respond. The data is cached for five minutes, so a retry usually works."
                action={<Button>Retry</Button>}
              />
              <StatePanel
                title="No decks in this window"
                detail="The 1 day window has no registrations yet. Try a longer window."
                action={<Button variant="secondary">Switch to 7d</Button>}
              />
            </div>
          </div>
        )
      }

      function Failed({ error, onRetry }) {
        return (
          <StatePanel
            title="The metagame could not be loaded"
            detail={error.message}
            action={<Button onClick={onRetry}>Retry</Button>}
          />
        )
      }

      function App() {
        const timeWindow = useTimeWindow()
        const [state, reload] = useMetagame(timeWindow)

        return (
          <div className="page">
            <header>
              <div className="page__eyebrow">Endstep</div>
              <h1>Pauper metagame</h1>
            </header>

            <div role="status" aria-live="polite">
              {state.status === 'loading' && (
                <StatePanel busy title="Loading" detail={`Fetching the ${timeWindow} window.`} />
              )}
              {state.status === 'error' && <Failed error={state.error} onRetry={reload} />}
            </div>

            {state.status === 'ready' && (
              <React.Fragment>
                <Panel>
                  <Summary totals={state.decks.totals} />
                </Panel>
                <Scaffold decks={state.decks} series={state.series} />
                <ChartScaffold series={state.series.series} />
              </React.Fragment>
            )}

            <Gallery />

            <footer>
              Data from <a href="https://endstep.cc/metagame">Endstep</a>. Not an official Endstep
              product.
            </footer>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
