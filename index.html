<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pauper Metagame</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f9f9f7;
        --surface: #fcfcfb;
        --edge: rgba(11, 11, 11, 0.1);

        --text-900: #0b0b0b;
        --text-600: #52514e;
        --text-400: #898781;
        --text-inverse: #ffffff;

        --rule: #e1e0d9;
        --baseline: #c3c2b7;

        --primary: #1c5cab;
        --primary-wash: #eaf1fb;
        --secondary: #3f3f3c;

        --up: #006300;
        --down: #d03b3b;

        --s1: #2a78d6;
        --s2: #eb6834;
        --s3: #1baf7a;
        --s4: #eda100;
        --s5: #e87ba4;
        --s6: #008300;
        --s7: #4a3aa7;
        --s8: #e34948;

        --seq-100: #cde2fb;
        --seq-200: #9ec5f4;
        --seq-300: #6da7ec;
        --seq-400: #3987e5;
        --seq-500: #256abf;
        --seq-600: #184f95;
        --seq-700: #0d366b;

        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text-900);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 1080px;
        margin: 0 auto;
        padding-inline: 20px;
        padding-block: 40px 72px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .page__eyebrow {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-400);
      }

      .page__controls {
        display: flex;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 22px;
      }

      .stat-list {
        display: flex;
        flex-wrap: wrap;
        gap: 34px;
        align-items: flex-end;
        margin: 0;
      }

      .stat-tile {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-tile__label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-400);
      }

      .stat-tile__value {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .stat-tile--hero .stat-tile__value {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .state-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 42px 22px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 10px;
      }

      .state-panel__title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .state-panel__detail {
        margin: 0;
        font-size: 14px;
        color: var(--text-600);
        max-width: 44ch;
      }

      .button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 9px 17px;
        border-radius: 7px;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .button--primary {
        background: var(--primary);
        color: var(--text-inverse);
      }

      .button--primary:hover {
        background: #184f95;
      }

      .button--secondary {
        background: var(--surface);
        color: var(--secondary);
        border-color: var(--edge);
      }

      .button--secondary:hover {
        background: #f1f0ec;
      }

      .button--ghost {
        background: transparent;
        color: var(--primary);
      }

      .button--ghost:hover {
        background: var(--primary-wash);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .button--primary:disabled:hover {
        background: var(--primary);
      }

      .button--secondary:disabled:hover {
        background: var(--surface);
      }

      .button--ghost:disabled:hover {
        background: transparent;
      }

      .segmented {
        display: inline-flex;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
        max-width: 100%;
      }

      @media (max-width: 400px) {
        .segmented {
          overflow-x: auto;
        }
      }

      .segmented__option {
        flex: 0 0 auto;
        font-family: inherit;
        cursor: pointer;
        border: 0;
        background: transparent;
        color: var(--text-600);
        font-size: 13px;
        font-weight: 600;
        padding: 7px 15px;
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }

      .segmented__option:hover {
        background: #f1f0ec;
        color: var(--text-900);
      }

      .segmented__option[aria-pressed='true'] {
        background: var(--primary);
        color: var(--text-inverse);
      }

      .segmented__option[aria-pressed='true']:hover {
        background: #184f95;
      }

      .segmented[data-busy] {
        background: var(--rule);
      }

      .segmented[data-busy] .segmented__option {
        cursor: progress;
      }



      .colour-pips {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        flex-shrink: 0;
      }

      .colour-pips__pip {
        width: 17px;
        height: 17px;
        display: block;
      }

      .colour-pips__pip text {
        font: 700 11px var(--sans);
        fill: #1a1714;
      }

      .chart-frame {
        width: 100%;
      }

      .chart-tooltip {
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 11px 13px;
        box-shadow: 0 4px 14px rgba(11, 11, 11, 0.09);
        display: inline-flex;
        flex-direction: column;
        gap: 7px;
        min-width: 196px;
      }

      .chart-tooltip__day {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-400);
      }

      .chart-tooltip__row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      .chart-tooltip__swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .chart-tooltip__name {
        color: var(--text-600);
        flex: 1;
      }

      .chart-tooltip__value {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
      }

      .chart-legend__item {
        all: unset;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: var(--text-600);
      }

      .chart-legend__item:hover {
        color: var(--text-900);
      }

      .chart-legend__item--off {
        opacity: 0.4;
        text-decoration: line-through;
      }

      .chart-legend__swatch {
        width: 12px;
        height: 3px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .skeleton {
        background: var(--rule);
        border-radius: 5px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
        }
      }

      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .deck-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
        gap: 16px;
      }

      .deck {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--edge);
        border-radius: 10px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
      }

      .deck:hover .deck__name {
        text-decoration: underline;
        text-decoration-thickness: 2px;
      }

      .deck__art {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 626 / 300;
        object-fit: cover;
        object-position: center 38%;
        background: var(--rule);
      }

      .deck__body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 15px 15px;
      }

      .deck__top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .deck__name {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        overflow-wrap: break-word;
        margin: 0;
        min-width: 0;
        min-height: 2.6em;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }

      .deck__stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0;
      }

      .deck__stats div {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .deck__stats dt {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-400);
      }

      .deck__stats dd {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .deck__keys {
        margin: auto 0 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--text-600);
      }

      .chart-section {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .chart-section__title {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .share-chart {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .share-chart__scroll {
        overflow-x: auto;
      }

      .share-chart__scroll > .chart-frame {
        min-width: 620px;
      }

      .share-chart__end {
        font-size: 12px;
        font-weight: 500;
        fill: var(--text-600);
      }

      footer {
        font-size: 13px;
        color: var(--text-600);
      }

      a {
        color: var(--primary);
        text-underline-offset: 3px;
      }

      .deck-table__scroll {
        overflow-x: auto;
      }

      .deck-table {
        border-collapse: collapse;
        width: 100%;
        min-width: 640px;
        font-size: 14px;
      }

      .deck-table__header {
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-400);
        padding: 0 12px 9px 0;
        border-bottom: 1px solid var(--baseline);
        white-space: nowrap;
      }

      .deck-table__header--numeric {
        text-align: right;
      }

      .deck-table__sort {
        font: inherit;
        color: inherit;
        text-transform: inherit;
        letter-spacing: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .deck-table__sort:hover {
        color: var(--text-900);
      }

      .deck-table__mark {
        color: var(--primary);
      }

      .deck-table__row:hover {
        background: #f5f4f0;
      }

      .deck-table__cell {
        padding: 9px 12px 9px 0;
        border-bottom: 1px solid var(--rule);
        vertical-align: middle;
      }

      .deck-table__row:last-child .deck-table__cell {
        border-bottom: 0;
      }

      .deck-table__cell--deck {
        text-align: left;
        font-weight: 600;
      }

      .deck-table__cell--numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .deck-table__cell--rank {
        width: 26px;
        color: var(--text-400);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js"
      integrity="sha384-XYVQ7LtYqgha4ByzNRLR6NHo9p0yVDvmTNuQkiIweU0U8WqLWBkH1L771VlP6fYx"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/recharts@3.10.1/umd/Recharts.js"
      integrity="sha384-B2qLloNSIrxapii5UnBrm+3aDNWhVlmIFQONXg13tES0lEd7YUzh6lrjD3WSiwZ1"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.9/babel.min.js"
      integrity="sha384-oLbIC13I/8DNBviftYPfOFQS5DC2WUmwk0SyIPmnzu1Ui+vYyATSSBJiJ5ETa4o/"
    ></script>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useCallback } = React
      const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip } = Recharts
      const { Customized, useXAxisScale, useYAxisScale, usePlotArea } = Recharts

      const FORMAT = 'Pauper'
      const POPULATION = 'rated'
      const WINDOWS = ['1d', '7d', '14d', '30d', 'season']
      const DEFAULT_WINDOW = '30d'
      const PAGE_SIZE = 24
      const MAX_RETRIES = 2
      const RETRY_BASE_MS = 400

      function readTimeWindow() {
        const value = new URLSearchParams(location.search).get('window')
        return WINDOWS.includes(value) ? value : DEFAULT_WINDOW
      }

      function failure(status) {
        if (status === 429) {
          return {
            kind: 'rateLimit',
            message: 'Too many requests reached Endstep. The data is cached for five minutes, so this usually clears on its own.',
          }
        }
        if (status === 502 || status === 504) {
          return { kind: 'upstream', message: 'Endstep did not respond.' }
        }
        return { kind: 'http', message: `The request failed with status ${status}.` }
      }

      function wait(ms, signal) {
        return new Promise((resolve, reject) => {
          if (signal.aborted) {
            reject(new DOMException('Aborted', 'AbortError'))
            return
          }

          const onAbort = () => {
            clearTimeout(timer)
            reject(new DOMException('Aborted', 'AbortError'))
          }

          const timer = setTimeout(() => {
            signal.removeEventListener('abort', onAbort)
            resolve()
          }, ms)

          signal.addEventListener('abort', onAbort, { once: true })
        })
      }

      async function getJson(path, params, signal) {
        const url = `/api/metagame/${path}?${new URLSearchParams(params)}`

        for (let attempt = 0; ; attempt += 1) {
          let response

          try {
            response = await fetch(url, { signal })
          } catch (error) {
            if (error.name === 'AbortError') throw error
            if (attempt === MAX_RETRIES) {
              throw Object.assign(new Error('The server could not be reached.'), { kind: 'network' })
            }
            await wait(RETRY_BASE_MS * 2 ** attempt, signal)
            continue
          }

          if (response.ok) {
            try {
              return await response.json()
            } catch (error) {
              if (error.name === 'AbortError') throw error
              throw Object.assign(new Error('The server returned a malformed response.'), {
                kind: 'malformed',
              })
            }
          }

          const detail = failure(response.status)
          const retryable = response.status === 429 || response.status >= 500

          if (!retryable || attempt === MAX_RETRIES) {
            throw Object.assign(new Error(detail.message), detail, { status: response.status })
          }

          await wait(RETRY_BASE_MS * 2 ** attempt, signal)
        }
      }

      function timeWindowUrl(value) {
        const url = new URL(location.href)
        url.searchParams.set('window', value)
        return url
      }

      function useTimeWindow() {
        const [value, setValue] = useState(readTimeWindow)

        useEffect(() => {
          history.replaceState(null, '', timeWindowUrl(readTimeWindow()))

          const sync = () => setValue(readTimeWindow())
          window.addEventListener('popstate', sync)
          return () => window.removeEventListener('popstate', sync)
        }, [])

        const select = useCallback(
          (next) => {
            if (next === value) return

            history.pushState(null, '', timeWindowUrl(next))
            setValue(next)
          },
          [value]
        )

        return [value, select]
      }

      function useMetagame(timeWindow) {
        const [state, setState] = useState({ status: 'loading' })
        const [reloads, setReloads] = useState(0)

        useEffect(() => {
          const controller = new AbortController()
          setState({ status: 'loading' })

          Promise.all([
            getJson(
              `${FORMAT}/decks`,
              {
                window: timeWindow,
                population: POPULATION,
                sort: 'share',
                dir: 'desc',
                page: 1,
                pageSize: PAGE_SIZE,
              },
              controller.signal
            ),
            getJson(
              `${FORMAT}/share-series`,
              { window: timeWindow, population: POPULATION },
              controller.signal
            ),
          ])
            .then(([decks, series]) => setState({ status: 'ready', decks, series }))
            .catch((error) => {
              if (error.name === 'AbortError') return
              setState({ status: 'error', error })
            })

          return () => controller.abort()
        }, [timeWindow, reloads])

        const reload = useCallback(() => setReloads((count) => count + 1), [])

        return [state, reload]
      }

      const PIP_FILL = {
        W: '#fffbd5',
        U: '#aae0fa',
        B: '#cbc2bf',
        R: '#f9aa8f',
        G: '#9bd3ae',
        C: '#cac5c0',
      }

      const PIP_NAME = {
        W: 'white',
        U: 'blue',
        B: 'black',
        R: 'red',
        G: 'green',
        C: 'colourless',
      }

      function Panel({ className, children, ...rest }) {
        return (
          <div {...rest} className={['panel', className].filter(Boolean).join(' ')}>
            {children}
          </div>
        )
      }

      function Button({ variant = 'primary', className, children, ...rest }) {
        return (
          <button type="button" {...rest} className={['button', 'button--' + variant, className].filter(Boolean).join(' ')}>
            {children}
          </button>
        )
      }

      function ColourPips({ colours }) {
        const known = (colours || []).filter((letter) => letter in PIP_FILL)
        const letters = known.length > 0 ? known : ['C']

        return (
          <span className="colour-pips">
            <span className="visually-hidden">
              Colours: {letters.map((letter) => PIP_NAME[letter]).join(', ')}
            </span>
            {letters.map((letter, index) => (
              <svg key={index} className="colour-pips__pip" viewBox="0 0 20 20" aria-hidden="true">
                <circle
                  cx="10"
                  cy="10"
                  r="9"
                  fill={PIP_FILL[letter]}
                  stroke="rgba(11,11,11,.22)"
                  strokeWidth="1"
                />
                <text x="10" y="14.3" textAnchor="middle">
                  {letter}
                </text>
              </svg>
            ))}
          </span>
        )
      }

      function SegmentedControl({ label, options, value, onChange, busy }) {
        return (
          <div className="segmented" role="group" aria-label={label} data-busy={busy || undefined}>
            {options.map((option) => (
              <button
                key={option}
                type="button"
                className="segmented__option"
                aria-pressed={option === value}
                onClick={() => onChange(option)}
              >
                {option}
              </button>
            ))}
          </div>
        )
      }

      function StatTile({ label, value, hero }) {
        return (
          <div className={hero ? 'stat-tile stat-tile--hero' : 'stat-tile'}>
            <dt className="stat-tile__label">{label}</dt>
            <dd className="stat-tile__value">{value}</dd>
          </div>
        )
      }

      function Skeleton({ width, height }) {
        return <div className="skeleton" style={{ width, height }} aria-hidden="true" />
      }

      function artSource(cardName) {
        return `https://endstep.cc/api/cards/image?${new URLSearchParams({
          name: cardName,
          version: 'art_crop',
        })}`
      }

      function DeckCard({ deck }) {
        return (
          <a
            className="deck"
            href={`https://endstep.cc/metagame/${FORMAT}/${deck.slug}`}
            target="_blank"
            rel="noreferrer"
            aria-label={`${deck.name}, on endstep.cc in a new tab`}
          >
            <img
              className="deck__art"
              src={artSource(deck.art.cardName)}
              alt={deck.art.cardName}
              loading="lazy"
              width="626"
              height="300"
            />
            <div className="deck__body">
              <div className="deck__top">
                <h3 className="deck__name">{deck.name}</h3>
                <ColourPips colours={deck.colours} />
              </div>
              <dl className="deck__stats">
                <div>
                  <dt>Share</dt>
                  <dd>{(deck.share.rate * 100).toFixed(2)}%</dd>
                </div>
                <div>
                  <dt>Players</dt>
                  <dd>{deck.players.toLocaleString('en-GB')}</dd>
                </div>
                <div>
                  <dt>Win rate</dt>
                  <dd>{(deck.matchWinRate.rate * 100).toFixed(1)}%</dd>
                </div>
              </dl>
              <p className="deck__keys">{deck.keyCards.join(' · ')}</p>
            </div>
          </a>
        )
      }

      function DeckGrid({ decks }) {
        return (
          <section className="deck-grid" aria-labelledby="deck-grid-heading">
            <h2 className="visually-hidden" id="deck-grid-heading">
              Decks by meta share
            </h2>
            {decks.map((deck) => (
              <DeckCard key={deck.id} deck={deck} />
            ))}
          </section>
        )
      }

      function StatePanel({ title, detail, action, busy }) {
        return (
          <div className="state-panel" aria-busy={busy || undefined}>
            <h2 className="state-panel__title">{title}</h2>
            {detail && <p className="state-panel__detail">{detail}</p>}
            {action}
          </div>
        )
      }

      const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']

      function matchesOf(deck) {
        return deck.matchWinRate.wins + deck.matchWinRate.losses
      }

      function percent(rate) {
        return `${(rate * 100).toFixed(1)}%`
      }

      const SORT_VALUES = {
        name: (deck) => deck.name,
        share: (deck) => deck.share.rate,
        players: (deck) => deck.players,
        matches: matchesOf,
        winRate: (deck) => deck.matchWinRate.rate,
      }

      function sortDecks(decks, key, direction) {
        const read = SORT_VALUES[key]
        const sign = direction === 'ascending' ? 1 : -1

        return [...decks].sort((left, right) => {
          const a = read(left)
          const b = read(right)
          return sign * (typeof a === 'string' ? a.localeCompare(b, 'en-GB') : a - b)
        })
      }

      function SortHeader({ column, label, numeric, sort, onSort }) {
        const active = sort.key === column

        return (
          <th
            scope="col"
            className={
              numeric ? 'deck-table__header deck-table__header--numeric' : 'deck-table__header'
            }
            aria-sort={active ? sort.direction : 'none'}
          >
            <button type="button" className="deck-table__sort" onClick={() => onSort(column)}>
              {label}
              {active && (
                <span className="deck-table__mark" aria-hidden="true">
                  {sort.direction === 'ascending' ? '\u25b2' : '\u25bc'}
                </span>
              )}
            </button>
          </th>
        )
      }

      function DeckTable({ decks }) {
        const [sort, setSort] = useState({ key: 'share', direction: 'descending' })

        const onSort = (key) =>
          setSort((current) => {
            if (current.key !== key) {
              return { key, direction: key === 'name' ? 'ascending' : 'descending' }
            }
            return {
              key,
              direction: current.direction === 'ascending' ? 'descending' : 'ascending',
            }
          })

        const ranks = new Map(decks.map((deck, index) => [deck.id, index + 1]))
        const rows = sortDecks(decks, sort.key, sort.direction)

        return (
          <Panel className="deck-table__scroll" tabIndex="0" role="region" aria-label="Deck table">
            <table className="deck-table">
              <caption className="visually-hidden">
                The top {decks.length} decks, sortable by column
              </caption>
              <thead>
                <tr>
                  <th scope="col" className="deck-table__header">
                    <span className="visually-hidden">Rank by share</span>
                  </th>
                  <SortHeader column="name" label="Deck" sort={sort} onSort={onSort} />
                  <th scope="col" className="deck-table__header">
                    Colours
                  </th>
                  <SortHeader column="share" label="Share" numeric sort={sort} onSort={onSort} />
                  <SortHeader column="players" label="Players" numeric sort={sort} onSort={onSort} />
                  <SortHeader column="matches" label="Matches" numeric sort={sort} onSort={onSort} />
                  <SortHeader
                    column="winRate"
                    label="Match win rate"
                    numeric
                    sort={sort}
                    onSort={onSort}
                  />
                  <th scope="col" className="deck-table__header deck-table__header--numeric">
                    Change
                  </th>
                </tr>
              </thead>
              <tbody>
                {rows.map((deck) => (
                  <tr key={deck.id} className="deck-table__row">
                    <td className="deck-table__cell deck-table__cell--rank">{ranks.get(deck.id)}</td>
                    <th scope="row" className="deck-table__cell deck-table__cell--deck">
                      {deck.name}
                    </th>
                    <td className="deck-table__cell">
                      <ColourPips colours={deck.colours} />
                    </td>
                    <td className="deck-table__cell deck-table__cell--numeric">
                      {percent(deck.share.rate)}
                    </td>
                    <td className="deck-table__cell deck-table__cell--numeric">
                      {formatCount(deck.players)}
                    </td>
                    <td className="deck-table__cell deck-table__cell--numeric">
                      {formatCount(matchesOf(deck))}
                    </td>
                    <td className="deck-table__cell deck-table__cell--numeric">
                      {percent(deck.matchWinRate.rate)}
                    </td>
                    <td className="deck-table__cell deck-table__cell--numeric" />
                  </tr>
                ))}
              </tbody>
            </table>
          </Panel>
        )
      }

      const rootTokens = getComputedStyle(document.documentElement)
      const token = (name) => rootTokens.getPropertyValue(name).trim()

      const SERIES_COLOURS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'].map(token)
      const CHART_GRID = token('--rule')
      const CHART_BASELINE = token('--baseline')
      const CHART_TICK = token('--text-400')
      const CHART_SURFACE = token('--surface')

      const CHART_AXIS = {
        tickLine: false,
        tick: { fill: CHART_TICK, fontSize: 12, style: { fontVariantNumeric: 'tabular-nums' } },
        axisLine: { stroke: CHART_BASELINE },
      }

      const CHART_CARTESIAN_GRID = { stroke: CHART_GRID, vertical: false }

      const seriesSlots = new Map()

      function seriesColours(keys) {
        const taken = new Set()
        const unplaced = []

        keys.forEach((key) => {
          const slot = seriesSlots.get(key)
          if (slot === undefined || taken.has(slot)) unplaced.push(key)
          else taken.add(slot)
        })

        let free = 0
        unplaced.forEach((key) => {
          while (taken.has(free)) free += 1
          taken.add(free)
          seriesSlots.set(key, free)
        })

        return new Map(keys.map((key) => [key, SERIES_COLOURS[seriesSlots.get(key)]]))
      }

      function ChartFrame({ aspect = 2.9, children }) {
        return (
          <div className="chart-frame" style={{ aspectRatio: String(aspect) }}>
            <ResponsiveContainer width="100%" height="100%">
              {children}
            </ResponsiveContainer>
          </div>
        )
      }

      function ChartTooltip({ active, payload, label, formatLabel = String, formatValue = String }) {
        if (!active || !payload) return null

        const rows = payload.filter((row) => row.value !== null && row.value !== undefined)
        if (rows.length === 0) return null

        rows.sort((a, b) => b.value - a.value)

        return (
          <div className="chart-tooltip">
            <div className="chart-tooltip__day">{formatLabel(label)}</div>
            {rows.map((row) => (
              <div className="chart-tooltip__row" key={row.dataKey}>
                <span className="chart-tooltip__swatch" style={{ background: row.color }} />
                <span className="chart-tooltip__name">{row.name}</span>
                <span className="chart-tooltip__value">{formatValue(row.value)}</span>
              </div>
            ))}
          </div>
        )
      }

      function ChartLegend({ items, hidden, onToggle }) {
        return (
          <div className="chart-legend">
            {items.map((item) => {
              const off = hidden.has(item.key)

              return (
                <button
                  key={item.key}
                  type="button"
                  className={off ? 'chart-legend__item chart-legend__item--off' : 'chart-legend__item'}
                  aria-pressed={!off}
                  onClick={() => onToggle(item.key)}
                >
                  <span className="chart-legend__swatch" style={{ background: item.colour }} />
                  {item.name}
                </button>
              )
            })}
          </div>
        )
      }

      function formatCount(value) {
        return value.toLocaleString('en-GB')
      }

      function shareRows(series) {
        const byDay = new Map()

        series.forEach((item) => {
          item.points.forEach((point) => {
            const row = byDay.get(point.day) || { day: point.day }
            row[item.deck.id] = point.rate === null ? null : point.rate * 100
            byDay.set(point.day, row)
          })
        })

        return [...byDay.values()].sort((a, b) => a.day.localeCompare(b.day))
      }

      const shortDay = (day) => day.slice(5)
      const axisShare = (share) => `${share}%`
      const tooltipShare = (share) => `${share.toFixed(2)}%`
      const longDay = (day) =>
        new Date(`${day}T00:00:00Z`).toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          timeZone: 'UTC',
        })

      const END_LABEL_OFFSET = 10
      const END_LABEL_GAP = 16
      const END_LABEL_CHAR_WIDTH = 8

      function endLabelGutter(series) {
        const longest = series.reduce((width, item) => Math.max(width, item.deck.name.length), 0)

        return END_LABEL_OFFSET + longest * END_LABEL_CHAR_WIDTH
      }

      function seriesEnd(item) {
        const last = item.points.findLast((point) => point.rate !== null)
        if (!last) return null

        return { key: item.deck.id, name: item.deck.name, day: last.day, share: last.rate * 100 }
      }

      function stackEnds(ends, bottom) {
        const placed = [...ends].sort((a, b) => a.y - b.y)

        let previous = -Infinity
        placed.forEach((end) => {
          end.labelY = Math.max(end.y, previous + END_LABEL_GAP)
          previous = end.labelY
        })

        const overflow = previous - bottom
        if (overflow > 0) placed.forEach((end) => (end.labelY -= overflow))

        return placed
      }

      function SeriesEnds({ ends }) {
        const xScale = useXAxisScale()
        const yScale = useYAxisScale()
        const plot = usePlotArea()

        if (!xScale || !yScale || !plot) return null

        const centre = xScale.bandwidth ? xScale.bandwidth() / 2 : 0
        const placed = stackEnds(
          ends.map((end) => ({ ...end, x: xScale(end.day) + centre, y: yScale(end.share) })),
          plot.y + plot.height
        )

        return (
          <g aria-hidden="true">
            {placed.map((end) => (
              <g key={end.key}>
                <circle
                  cx={end.x}
                  cy={end.y}
                  r="3.5"
                  fill={end.colour}
                  stroke={CHART_SURFACE}
                  strokeWidth="2"
                />
                <text
                  className="share-chart__end"
                  x={end.x + END_LABEL_OFFSET}
                  y={end.labelY}
                  dy="0.32em"
                >
                  {end.name}
                </text>
              </g>
            ))}
          </g>
        )
      }

      function ShareOverTime({ series }) {
        const [hidden, setHidden] = useState(() => new Set())

        const colours = seriesColours(series.map((item) => item.deck.id))
        const rows = shareRows(series)
        const shown = series.filter((item) => !hidden.has(item.deck.id))
        const ends = shown
          .map(seriesEnd)
          .filter(Boolean)
          .map((end) => ({ ...end, colour: colours.get(end.key) }))

        const toggle = (key) =>
          setHidden((current) => {
            const next = new Set(current)
            if (next.has(key)) next.delete(key)
            else next.add(key)
            return next
          })

        return (
          <section className="chart-section" aria-labelledby="share-over-time">
            <h2 className="chart-section__title" id="share-over-time">
              Share over time
            </h2>

            <Panel className="share-chart">
              <div
                className="share-chart__scroll"
                tabIndex="0"
                role="region"
                aria-label="Daily meta share, top eight decks"
              >
                <ChartFrame>
                  <LineChart
                    data={rows}
                    margin={{ top: 8, right: endLabelGutter(series), bottom: 0, left: 0 }}
                    accessibilityLayer
                  >
                    <CartesianGrid {...CHART_CARTESIAN_GRID} />
                    <XAxis dataKey="day" tickFormatter={shortDay} minTickGap={24} {...CHART_AXIS} />
                    <YAxis tickFormatter={axisShare} width={46} {...CHART_AXIS} />
                    <Tooltip
                      cursor={{ stroke: CHART_BASELINE }}
                      content={<ChartTooltip formatLabel={longDay} formatValue={tooltipShare} />}
                    />
                    {shown.map((item) => (
                      <Line
                        key={item.deck.id}
                        type="linear"
                        dataKey={item.deck.id}
                        name={item.deck.name}
                        stroke={colours.get(item.deck.id)}
                        strokeWidth={2}
                        dot={false}
                        activeDot={{ r: 3.5, strokeWidth: 2, stroke: CHART_SURFACE }}
                        isAnimationActive={false}
                      />
                    ))}
                    <Customized component={<SeriesEnds ends={ends} />} />
                  </LineChart>
                </ChartFrame>
              </div>

              <ChartLegend
                items={series.map((item) => ({
                  key: item.deck.id,
                  name: item.deck.name,
                  colour: colours.get(item.deck.id),
                }))}
                hidden={hidden}
                onToggle={toggle}
              />
            </Panel>
          </section>
        )
      }

      function formatDate(value, withYear) {
        const [year, month, day] = value.split('-').map(Number)
        const head = `${day} ${MONTHS[month - 1]}`

        return withYear ? `${head} ${year}` : head
      }

      function lastCoveredDay(to) {
        const day = new Date(`${to}T00:00:00Z`)
        day.setUTCDate(day.getUTCDate() - 1)

        return day.toISOString().slice(0, 10)
      }

      function formatWindow({ from, to }) {
        const last = lastCoveredDay(to)
        const sameYear = from.slice(0, 4) === last.slice(0, 4)

        return `${formatDate(from, !sameYear)} to ${formatDate(last, true)}`
      }

      function formatPopulation(population) {
        return population.charAt(0).toUpperCase() + population.slice(1)
      }

      function Summary({ decks }) {
        const { provenance, totals } = decks

        return (
          <dl className="stat-list">
            <StatTile hero label="Registrations" value={formatCount(totals.registrations)} />
            <StatTile label="Players" value={formatCount(totals.players)} />
            <StatTile label="Archetypes" value={formatCount(decks.decks.total)} />
            <StatTile label="Window" value={formatWindow(provenance.window)} />
            <StatTile label="Population" value={formatPopulation(provenance.population)} />
          </dl>
        )
      }

      function App() {
        const [timeWindow, selectTimeWindow] = useTimeWindow()
        const [state, reload] = useMetagame(timeWindow)

        return (
          <div className="page">
            <header>
              <div className="page__eyebrow">Endstep</div>
              <h1>Pauper metagame</h1>
            </header>

            <div className="page__controls">
              <SegmentedControl
                label="Time window"
                options={WINDOWS}
                value={timeWindow}
                onChange={selectTimeWindow}
                busy={state.status === 'loading'}
              />
            </div>

            <div role="status" aria-live="polite">
              {state.status === 'loading' && (
                <StatePanel busy title="Loading" detail={`Fetching the ${timeWindow} window.`} />
              )}
              {state.status === 'error' && <Failed error={state.error} onRetry={reload} />}
            </div>

            {state.status === 'ready' && (
              <React.Fragment>
                <Panel>
                  <Summary decks={state.decks} />
                </Panel>
                <DeckGrid decks={state.decks.decks.items} />
                <DeckTable decks={state.decks.decks.items} />
                <ShareOverTime series={state.series.series} />
              </React.Fragment>
            )}

            <footer>
              Data from <a href="https://endstep.cc/metagame">endstep.cc</a>. This is not an
              official Endstep product.
            </footer>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
